name: Deploy Ecoguardianas

on:
  push:
    branches:
      - main
    paths:
      - 'event-staff-manager/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-staff-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: event-staff-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOGUARDIANAS }}

      - name: Deploy to Firebase
        run: npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project ecoguardianas --non-interactive
